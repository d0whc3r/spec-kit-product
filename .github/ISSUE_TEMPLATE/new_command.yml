name: New command proposal
description: Propose a new /speckit.product.* command. Adding a command is a breaking change.
title: "feat(command): <command name>"
labels: ["enhancement", "command", "needs-triage", "breaking"]
body:
  - type: markdown
    attributes:
      value: |
        Adding a command touches the command file, its template, `extension.yml`, `catalog.json`, and the docs. Spec Kit generates the per-agent files at install time. Read `AGENTS.md` before filing.

  - type: input
    id: command-name
    attributes:
      label: Proposed command name
      placeholder: speckit.product.<area>.<verb>
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: One paragraph. Why does this command need to exist? Which audience is it for?
    validations:
      required: true

  - type: textarea
    id: inputs-outputs
    attributes:
      label: Inputs and outputs
      description: Which files does it read, which file does it write, and what format does it produce?
      placeholder: |
        Reads: spec.md, plan.md
        Writes: product/40-foo.md
        Format: PRFAQ section followed by Gherkin scenarios
    validations:
      required: true

  - type: textarea
    id: hooks
    attributes:
      label: Hook integration
      description: Should the command be invoked automatically after `specify`, `clarify`, `plan`, or another lifecycle event?
    validations:
      required: false

  - type: textarea
    id: files-touched
    attributes:
      label: Files that change
      description: Confirm the command file, the template, and the docs that you will add or change.
      value: |
        - [ ] commands/speckit.product.<area>.<verb>.md
        - [ ] templates/product-<area>-template.md
        - [ ] extension.yml provides.commands (and hooks, if any)
        - [ ] catalog.json provides counts
        - [ ] README.md, WORKFLOW.md, docs/, and web/index.html
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I confirm this command does not duplicate an existing one.
          required: true
        - label: I understand a new command is a breaking change requiring a `BREAKING CHANGE:` footer in the commit.
          required: true
