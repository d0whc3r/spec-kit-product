name: pages

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "docs/**"
      - "examples/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; do not cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy web/ to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The site renders the real example artifacts at runtime. They live at
      # /examples (single source of truth); the examples:sync script copies them
      # under web/ so they ship with the published site.
      - name: Stage examples into the site
        run: pnpm examples:sync

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
