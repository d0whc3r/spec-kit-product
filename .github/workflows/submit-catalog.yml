name: submit-catalog

# Manual fallback. Re-renders the upstream catalog issue document for a given
# release tag and uploads it as an artifact. The `release` workflow already
# does this inline on every publish; use this to regenerate it on demand.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.4)"
        required: true

permissions:
  contents: read

jobs:
  submit:
    name: render upstream catalog issue
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Render and upload upstream catalog issue
        uses: ./.github/actions/render-catalog-issue
        with:
          version: ${{ steps.tag.outputs.version }}
          git-tag: ${{ steps.tag.outputs.tag }}
