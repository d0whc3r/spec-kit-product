name: sync-wiki

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/sync-wiki.yml"
      - ".github/actions/publish-wiki/**"
      - ".github/scripts/stage-wiki.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: publish docs to GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/publish-wiki
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
