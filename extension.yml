schema_version: "1.0"

extension:
  id: product
  name: "Product Spec Extension"
  version: "0.5.2"
  description: "Generates PRFAQ, Lean PRD, stakeholder summaries, and technical designs from engineering specs."
  author: spec-kit-product contributors
  repository: https://github.com/d0whc3r/spec-kit-product
  homepage: https://github.com/d0whc3r/spec-kit-product
  license: MIT

requires:
  speckit_version: ">=0.2.0"

provides:
  commands:
    - name: speckit.product.spec
      file: commands/speckit.product.spec.md
      description: "Generate a product spec and quality checklist from the current feature's spec.md"
    - name: speckit.product.info
      file: commands/speckit.product.info.md
      description: "Generate a short, stakeholder-readable product-info.md from the current feature's spec.md"
    - name: speckit.product.plan
      file: commands/speckit.product.plan.md
      description: "Generate a high-level, product-oriented plan from the current feature's plan.md"
    - name: speckit.product.design
      file: commands/speckit.product.design.md
      description: "Generate a high-level technical design document from the current feature's plan.md and spec.md, aimed at tech leads and senior developers"

hooks:
  after_specify:
    command: speckit.product.info
    optional: true
    prompt: "Generate the stakeholder summary product/00-info.md from the new spec.md?"
    description: "Generate product/00-info.md from spec.md (recommended first artifact)"
  after_clarify:
    command: speckit.product.info
    optional: true
    prompt: "Regenerate the stakeholder summary after clarification?"
    description: "Update product/00-info.md from the clarified spec.md"
  after_plan:
    command: speckit.product.plan
    optional: true
    prompt: "Generate the product-facing plan product/20-plan.md from plan.md?"
    description: "Generate product/20-plan.md from plan.md"

tags:
  - product
  - spec
  - prd
  - design
  - documentation
  - prfaq
  - jtbd
  - lean-prd
  - requirements
  - product-management
  - planning
  - stakeholder
  - technical-design
  - brownfield
